<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Gran Vía Tienda Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@200;300;400;600&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap">

<style>
/* Layout: vitrina negra arriba (como la fachada de la tienda), salón marfil para el producto, recuadro dorado del logo como firma */
:root{
  --vitrina:#0d0c0b;        /* negro de la fachada y el logo */
  --vitrina-2:#1a1816;
  --champagne:#c8a77a;      /* dorado del logo */
  --champagne-hi:#e2c9a2;
  --marfil:#f7f3ec;         /* salón de la tienda */
  --marmol:#ece6dc;
  --tinta:#1b1917;
  --tinta-2:#5c564f;
  --tinta-3:#8d867d;
  --vino:#6e1f2b;           /* colección noche */
  --hilo:rgba(27,25,23,.12);
  --display:"Antonio","Oswald","Arial Narrow",sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --body:"Jost","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased}
body{background:var(--marfil);color:var(--tinta);font-family:var(--body);font-size:15px;line-height:1.55;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--vitrina)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--champagne);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--body);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--tinta-3)}
.disp{font-family:var(--display);font-weight:300;text-transform:uppercase;letter-spacing:.02em;line-height:.95}
.serif-it{font-family:var(--serif);font-style:italic;font-weight:400}

/* demo ribbon */
.ribbon{background:var(--champagne);color:var(--vitrina);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-align:center;padding-block:6px;font-weight:500}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--vitrina);color:var(--marfil)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;gap:16px}
.nav{display:flex;gap:28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.nav button{background:none;border:0;padding:8px 0;color:rgba(247,243,236,.72);transition:color .15s}
.nav button:hover,.nav button[aria-current="true"]{color:var(--champagne-hi)}
.brand{background:none;border:0;padding:0;display:block}
.brand img{height:54px;width:auto;display:block}
.tools{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.icon-btn{background:none;border:0;width:44px;height:44px;display:grid;place-items:center;color:var(--marfil);position:relative}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.3}
.count{position:absolute;top:6px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--champagne);color:var(--vitrina);font-size:10px;font-weight:500;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 4px}
.menu-btn{display:none}
@media (max-width:820px){
  .top .wrap{grid-template-columns:auto 1fr auto;height:62px}
  .nav{display:none}.menu-btn{display:grid}
  .brand{justify-self:center}.brand img{height:44px}
  .nav.open{display:flex;position:absolute;top:62px;left:0;right:0;flex-direction:column;gap:0;background:var(--vitrina);padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-top:1px solid rgba(255,255,255,.08)}
  .nav.open button{text-align:left;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
}

/* hero */
.hero{background:var(--vitrina);color:var(--marfil);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:56px 64px}
.hero h1{font-size:clamp(52px,8vw,112px);color:var(--marfil)}
.hero h1 em{display:block;font-family:var(--serif);font-style:italic;text-transform:none;font-weight:400;color:var(--champagne-hi);font-size:.52em;letter-spacing:0;margin-top:14px;line-height:1.1}
.hero p{max-width:44ch;color:rgba(247,243,236,.7);margin:22px 0 32px;font-weight:300;font-size:16px}
.hero .eyebrow{color:var(--champagne)}
.hero-art{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.hero-art .frame:nth-child(2){margin-top:56px}
.hero-art img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:36px;padding-block:40px 48px}.hero-art .frame:nth-child(2){margin-top:32px}}

/* signature: gold hairline frame (the logo's box) */
.frame{position:relative;display:block}
.frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(226,201,162,.0);transition:border-color .25s var(--ease),inset .25s var(--ease);pointer-events:none}
.frame.on::after,.card:hover .frame::after,.card:focus-visible .frame::after{border-color:rgba(226,201,162,.9);inset:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 28px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;border:1px solid var(--champagne);background:transparent;color:var(--champagne-hi);position:relative;transition:background .18s,color .18s,transform .12s}
.btn::before{content:"";position:absolute;inset:3px;border:1px solid rgba(200,167,122,.35);pointer-events:none}
.btn:hover{background:var(--champagne);color:var(--vitrina)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--vitrina);color:var(--marfil);border-color:var(--vitrina)}
.btn.solid::before{border-color:rgba(200,167,122,.55)}
.btn.solid:hover{background:var(--vitrina-2);color:var(--champagne-hi)}
.btn.full{width:100%}
.btn.ws{background:#1f6f4a;border-color:#1f6f4a;color:#fff}.btn.ws::before{border-color:rgba(255,255,255,.3)}.btn.ws:hover{background:#185a3c}
.btn[disabled]{opacity:.4;pointer-events:none}

/* occasions — the store's own way of selling */
section{padding-block:72px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(34px,4.6vw,56px)}
.sec-head p{max-width:40ch;color:var(--tinta-2);margin:8px 0 0}
.link{background:none;border:0;border-bottom:1px solid var(--tinta);padding:4px 0;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.occasions{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.occ{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:14px}
.occ .frame img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;filter:saturate(.92)}
.occ:hover .frame::after{border-color:rgba(226,201,162,.95);inset:12px}
.occ .hour{font-family:var(--display);font-weight:300;font-size:13px;letter-spacing:.14em;color:var(--tinta-3)}
.occ h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:28px;letter-spacing:.03em;line-height:1}
.occ span.s{color:var(--tinta-2);font-size:14px}
@media (max-width:820px){.occasions{grid-template-columns:1fr 1fr}}

/* combo strip: "un vestido, dos combinaciones" */
.combo{background:var(--marmol)}
.combo .wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:56px;align-items:center}
.combo h2{font-size:clamp(36px,5vw,64px)}
.combo-pics{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:end}
.combo-pics img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.combo-pics .acc{background:var(--marfil);padding:16px}
.combo-pics .acc img{aspect-ratio:1;object-fit:cover}
@media (max-width:820px){.combo .wrap{grid-template-columns:1fr;gap:32px}}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 20px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:28px 12px}}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .frame{background:var(--marmol);overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.card:hover img{transform:scale(1.03)}
.tag{position:absolute;top:14px;left:14px;z-index:1;background:var(--marfil);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:5px 8px;font-weight:500}
.tag.new{background:var(--vitrina);color:var(--champagne-hi)}
.card .name{font-size:14px;font-weight:400;line-height:1.35}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price{font-variant-numeric:tabular-nums;font-weight:500;font-size:14px}
.swatches{display:flex;gap:5px}
.sw{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.15)}

/* catalog */
.cat-head{background:var(--vitrina);color:var(--marfil);padding-block:44px 36px}
.cat-head h1{font-size:clamp(44px,7vw,88px)}
.cat-head .eyebrow{color:var(--champagne)}
.filters{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:20;background:var(--marfil);border-bottom:1px solid var(--hilo)}
@media (max-width:820px){.filters{top:calc(62px + env(safe-area-inset-top,0px))}}
.filters .wrap{display:flex;gap:10px;align-items:center;padding-block:14px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:38px;padding:0 16px;border:1px solid var(--hilo);background:transparent;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--vitrina);color:var(--champagne-hi);border-color:var(--vitrina)}
.filters select{flex:none;height:38px;border:1px solid var(--hilo);background:var(--marfil);padding:0 10px;font:inherit;font-size:13px;margin-left:auto}
.results{color:var(--tinta-3);font-size:13px;margin:28px 0 20px;font-variant-numeric:tabular-nums}
.empty{padding:64px 0;text-align:center;color:var(--tinta-2)}

/* product page */
.pdp .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding-block:40px 72px}
@media (max-width:820px){.pdp .wrap{grid-template-columns:1fr;gap:28px;padding-block:20px 48px}}
.crumbs{font-size:12px;color:var(--tinta-3);letter-spacing:.06em;margin-bottom:18px}
.crumbs button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px}
.gallery .frame{background:var(--marmol)}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.info h1{font-family:var(--display);font-weight:300;text-transform:uppercase;font-size:clamp(34px,4vw,50px);line-height:1;letter-spacing:.02em;margin:10px 0 14px}
.info .price{font-size:22px;font-weight:400}
.info .desc{color:var(--tinta-2);max-width:48ch;margin:20px 0 28px}
.opt-label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.opt-label span{color:var(--tinta-3);font-weight:400;letter-spacing:.06em;text-transform:none;font-size:13px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.size{width:52px;height:46px;border:1px solid var(--hilo);background:transparent;font-size:13px;font-variant-numeric:tabular-nums}
.size:hover{border-color:var(--tinta)}
.size[aria-pressed="true"]{border-color:var(--vitrina);background:var(--vitrina);color:var(--marfil)}
.size[disabled]{color:var(--tinta-3);text-decoration:line-through;opacity:.5;cursor:not-allowed}
.colors{display:flex;gap:10px;margin-bottom:28px}
.colors .c{width:34px;height:34px;border-radius:50%;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.colors .c[aria-pressed="true"]{box-shadow:0 0 0 2px var(--marfil),0 0 0 3px var(--tinta)}
.buy{display:grid;gap:10px}
.hint{font-size:13px;color:var(--vino);min-height:20px}
.perks{display:grid;gap:12px;margin-top:28px;padding-top:24px;border-top:1px solid var(--hilo);font-size:14px;color:var(--tinta-2)}
.perks div{display:flex;gap:12px;align-items:flex-start}
.perks svg{flex:none;width:18px;height:18px;stroke:var(--champagne);fill:none;stroke-width:1.4;margin-top:2px}
.look{margin-top:36px}
.look-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.look-row .card .name{font-size:13px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(13,12,11,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--marfil);z-index:90;transform:translateX(100%);transition:transform .32s var(--ease);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--hilo)}
.drawer header h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:24px;letter-spacing:.04em}
.drawer .icon-btn{color:var(--tinta)}
.lines{flex:1;overflow-y:auto;padding:8px 24px}
.line{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--hilo);align-items:start}
.line img{width:76px;aspect-ratio:3/4;object-fit:cover;display:block}
.line .n{font-size:14px;line-height:1.3}
.line .v{font-size:12px;color:var(--tinta-3);margin-top:4px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--hilo);margin-top:10px}
.qty button{width:32px;height:32px;background:none;border:0}
.qty span{min-width:22px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.rm{background:none;border:0;font-size:12px;color:var(--tinta-3);text-decoration:underline;padding:4px 0}
.sum{padding:20px 24px;border-top:1px solid var(--hilo);display:grid;gap:10px;background:var(--marmol)}
.sum .row{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.sum .row.total{font-size:17px;font-weight:500;padding-top:6px}
.cart-empty{text-align:center;padding:64px 12px;color:var(--tinta-2)}
.cart-empty .disp{font-size:30px;color:var(--tinta);margin-bottom:8px}

/* checkout modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;pointer-events:none;opacity:0;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{background:var(--marfil);width:min(520px,100%);max-height:calc(100% - 24px);overflow-y:auto;padding:28px;position:relative;transform:scale(.96);transition:transform .25s var(--ease)}
.modal.on .sheet{transform:none}
.sheet::before{content:"";position:absolute;inset:8px;border:1px solid rgba(200,167,122,.6);pointer-events:none}
.sheet h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:28px;margin-bottom:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hilo);margin:20px 0}
.tabs button{height:44px;background:none;border:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--vitrina);color:var(--champagne-hi)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2)}
.field input,.field select{height:46px;border:1px solid var(--hilo);background:#efeae2;padding:0 12px;font:inherit;font-size:15px;color:var(--tinta)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wa-preview{background:#e7f1ea;border-left:2px solid #1f6f4a;padding:14px;font-size:13px;white-space:pre-wrap;color:#1d3a2c;margin-bottom:16px;font-family:var(--body)}
.done{text-align:center;padding:12px 0}
.done .disp{font-size:40px;margin:8px 0}

/* visit */
.visit{background:var(--vitrina);color:var(--marfil)}
.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.visit img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.visit h2{font-size:clamp(36px,5vw,60px)}
.visit .eyebrow{color:var(--champagne)}
.stores{display:grid;gap:20px;margin:28px 0}
.stores div{border-left:1px solid var(--champagne);padding-left:16px}
.stores b{display:block;font-weight:500;letter-spacing:.04em}
.stores span{color:rgba(247,243,236,.65);font-size:14px}
@media (max-width:820px){.visit .wrap{grid-template-columns:1fr;gap:32px}}

footer{background:var(--vitrina);color:rgba(247,243,236,.55);font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:24px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--vitrina);color:var(--marfil);padding:14px 20px;font-size:13px;z-index:120;opacity:0;transition:opacity .2s,transform .25s var(--ease);pointer-events:none;border:1px solid rgba(200,167,122,.5);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

</head>
<body>
<div class="ribbon">Propuesta de tienda online · demo navegable</div>
<header class="top">
  <div class="wrap">
    <nav class="nav" id="nav" aria-label="Principal">
      <button data-go="inicio">Inicio</button>
      <button data-go="catalogo">Catálogo</button>
      <button data-go="noche">Noche</button>
      <button data-go="visitanos">Tiendas</button>
    </nav>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="brand" data-go="inicio" aria-label="La Gran Vía, inicio"><img src="img/logo.jpg" alt="La Gran Vía"></button>
    <div class="tools">
      <button class="icon-btn" data-go="catalogo" aria-label="Buscar en catálogo"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
      <button class="icon-btn" id="cartBtn" aria-label="Abrir bolsa"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg><span class="count" id="count" hidden>0</span></button>
    </div>
  </div>
</header>

<main id="view"></main>

<footer><div class="wrap"><span>© 2026 La Gran Vía · Guayaquil, Ecuador</span><span>Demo de propuesta. Precios y tallas de referencia.</span></div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Tu bolsa" aria-hidden="true">
  <header><h2>Tu bolsa</h2><button class="icon-btn" id="closeCart" aria-label="Cerrar bolsa"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="lines" id="lines"></div>
  <div class="sum" id="sum"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="coTitle"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const OCC={casual:{t:"Casual",h:"10:00",s:"Para el día a día, con estilo"},brunch:{t:"Brunch",h:"12:30",s:"Café con amigas, salidas de día"},coctel:{t:"Cóctel",h:"18:00",s:"After office, cumpleaños, cenas"},noche:{t:"Noche",h:"21:00",s:"Bodas, galas y grandes eventos"}};

function catalog(){

 if(filt.sort==="asc")list=[...list].sort((a,b)=>a.p-b.p);
 if(filt.sort==="desc")list=[...list].sort((a,b)=>b.p-a.p);
 if(filt.sort==="nuevo")list=[...list].sort((a,b)=>b.nuevo-a.nuevo);
 const title=filt.o==="todas"?"Catálogo":OCC[filt.o].t;
 return `<div class="cat-head"><div class="wrap"><p class="eyebrow">${filt.o==="todas"?"Todas las ocasiones":OCC[filt.o].s}</p><h1 class="disp">${title}</h1></div></div>

 <div class="wrap"><p class="results">${list.length} prendas</p>${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<p class="empty">No hay prendas para esta ocasión todavía.</p>`}<div style="height:72px"></div></div>`}

const view=$("#view");
function route(){
 const h=(location.hash||"#inicio").slice(1);
 let html; window.scrollTo(0,0);
 if(h==="catalogo")html=catalog();
 else if(["casual","brunch","coctel","noche"].includes(h)){filt.o=h;html=catalog()}
 else if(/^p-\d+$/.test(h))html=pdp(+h.slice(2));
 else if(h==="visitanos"){html=home();setTimeout(()=>document.getElementById("visitanos")?.scrollIntoView(),0)}
 else html=home();
 view.innerHTML=html;
 document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.go===h||(b.dataset.go==="catalogo"&&h==="catalogo"))));
 $("#nav").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");
}
function go(h){if(h==="catalogo")filt.o="todas"; if(location.hash==="#"+h)route(); else location.hash=h}
window.addEventListener("hashchange",route);

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-pid],[data-occ],[data-filter],[data-size],[data-color],[data-acc]");
 if(!t)return;
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.occ){filt.o=t.dataset.occ;location.hash=t.dataset.occ;route();return}
 if(t.dataset.filter){filt.o=t.dataset.filter;view.innerHTML=catalog();return}
 if(t.dataset.size){sel.size=t.dataset.size;document.querySelectorAll(".size").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));$("#hint").textContent="";return}
 if(t.dataset.color){sel.color=t.dataset.color;document.querySelectorAll(".colors .c").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));$("#colorName").textContent=t.dataset.color;return}
 if(t.dataset.acc){const a=ACC.find(x=>x.id===t.dataset.acc);addLine({key:a.id,n:a.n,p:a.p,img:22,v:"Accesorio"});return}
 if(t.dataset.pid){location.hash="p-"+t.dataset.pid}
});
document.addEventListener("change",e=>{if(e.target.id==="sort"){filt.sort=e.target.value;view.innerHTML=catalog()}});
view.addEventListener("click",e=>{
 if(e.target.id!=="addBtn")return;
 if(!sel.size){$("#hint").textContent="Elige tu talla para continuar.";return}
 const p=P.find(x=>x.id===sel.id);
 addLine({key:p.id+"-"+sel.size+"-"+sel.color,n:p.n,p:p.p,img:p.id,v:`Talla ${sel.size} · ${sel.color}`});
});

function addLine(l){const f=cart.find(x=>x.key===l.key);f?f.q++:cart.push({...l,q:1});save();renderCart();toast(`${l.n} se agregó a tu bolsa`)}
let tt;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),2200)}
const sub=()=>cart.reduce((s,l)=>s+l.p*l.q,0);
function renderCart(){
 const n=cart.reduce((s,l)=>s+l.q,0);const c=$("#count");c.hidden=!n;c.textContent=n;
 if(!cart.length){$("#lines").innerHTML=`<div class="cart-empty"><p class="disp">Tu bolsa está vacía</p><p>Empieza por la ocasión: casual, brunch, cóctel o noche.</p><button class="btn solid" data-go="catalogo" style="margin-top:16px">Ir al catálogo</button></div>`;$("#sum").hidden=true;return}
 $("#sum").hidden=false;
 $("#lines").innerHTML=cart.map((l,i)=>`<div class="line"><img src="img/p${l.img}.jpg" alt=""><div><div class="n">${l.n}</div><div class="v">${l.v}</div><div class="qty"><button data-q="${i}" data-d="-1" aria-label="Quitar uno">−</button><span>${l.q}</span><button data-q="${i}" data-d="1" aria-label="Agregar uno">+</button></div></div><div style="text-align:right"><div class="price">${money(l.p*l.q)}</div><button class="rm" data-rm="${i}">Quitar</button></div></div>`).join("");
 const s=sub(),env=s>=80?0:4.5;
 $("#sum").innerHTML=`<div class="row"><span>Subtotal</span><span>${money(s)}</span></div><div class="row"><span>Envío Guayaquil</span><span>${env?money(env):"Gratis"}</span></div><div class="row total"><span>Total</span><span>${money(s+env)}</span></div><button class="btn solid full" id="checkout">Finalizar compra</button>`;
}
$("#lines").addEventListener("click",e=>{const q=e.target.closest("[data-q]"),r=e.target.closest("[data-rm]");if(q){const l=cart[+q.dataset.q];l.q+=+q.dataset.d;if(l.q<1)cart.splice(+q.dataset.q,1)}else if(r){cart.splice(+r.dataset.rm,1)}else return;save();renderCart()});
function openCart(o){$("#drawer").classList.toggle("on",o);$("#scrim").classList.toggle("on",o);$("#drawer").setAttribute("aria-hidden",String(!o));if(o)$("#closeCart").focus()}
$("#cartBtn").onclick=()=>openCart(true);$("#closeCart").onclick=()=>openCart(false);$("#scrim").onclick=()=>{openCart(false);closeModal()};
$("#drawer").addEventListener("click",e=>{if(e.target.closest("[data-go]"))openCart(false)});
$("#menuBtn").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",String(o))};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){openCart(false);closeModal()}});
